<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ap_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#ap_grad)" filter="url(#shadow)" />
  
  <!-- Card Outline / Bank Chip -->
  <rect x="22" y="30" width="56" height="40" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="22" y1="42" x2="78" y2="42" stroke="#FFFFFF" stroke-width="4" />
  
  <!-- Dynamic Money / Pay symbol -->
  <circle cx="34" cy="56" r="4" fill="#FBBF24" />
  <rect x="44" y="53" width="22" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
  
  <!-- Accent Sparkle -->
  <path d="M72 20 L74 25 L79 27 L74 29 L72 34 L70 29 L65 27 L70 25 Z" fill="#FBBF24" />
</svg>
